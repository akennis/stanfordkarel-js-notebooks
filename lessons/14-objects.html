      // ─── Intro: what an object is, creating one, reading and writing fields ───

      { md: `<h2>Which number was which?</h2>
      <p>An array is perfect when every slot means the same kind of thing: a row of pile sizes, a pole of
      colors. But often the values you need to keep together mean <em>different</em> things. A flag has an
      avenue, a height, and a color. You could put them in an array:</p>
      <pre class="code">let flag = [3, 4, "Red"];   // flag[0] is... the avenue? the height?</pre>
      <p>and then spend the rest of the program remembering that slot 0 is the avenue and slot 1 is the
      height. Mix them up and Karel plants a flag four tall on avenue 3 instead of three tall on avenue 4,
      with no error to warn you.</p>
      <p>An <strong>object</strong> fixes this by giving every value a <em>name</em> instead of a position.
      It's written with curly braces and <code>key: value</code> pairs:</p>
      <pre class="code">let flag = { avenue: 3, height: 4, color: "Red" };</pre>
      <p>You read a value with a dot and its key:</p>
      <pre class="code">flag.avenue          // 3
flag.color           // "Red"
flag.width           // undefined: there is no "width" key
flag.height = 5;     // change a field:  { avenue: 3, height: 5, color: "Red" }
flag.height++;       //                  { avenue: 3, height: 6, color: "Red" }
flag.planted = true; // add a new field: { avenue: 3, height: 6, color: "Red", planted: true }</pre>
      <div class="callout"><strong>Keys, values, fields</strong>
      In <code>{ avenue: 3, height: 4 }</code>, <code>avenue</code> and <code>height</code> are the
      <em>keys</em> and <code>3</code> and <code>4</code> are their <em>values</em>. A key and its value
      together are a <strong>field</strong> (you'll also hear <em>property</em>). The order you write them in
      doesn't matter: an object is looked up by name, never by position.</div>` },

      { md: `<h2>One argument instead of five</h2>
      <p><strong>Problem.</strong> Paint a flag: a gray pole three corners west of a red banner. Both are
      rectangles, so one helper should paint either one.</p>
      <p>A rectangle needs five facts: where its south-west corner is (avenue and street), how wide and how
      tall it is, and its color. With five plain parameters every call looks like
      <code>paintRect(k, 3, 3, 3, 2, "Red")</code>, and nothing on that line tells you which 3 is which.
      Hand the helper one <em>object</em> instead and every value arrives labelled: inside,
      <code>rect.width</code> can't be confused with <code>rect.height</code>.</p>
      <p>Notice <code>goTo(k, rect)</code>. <code>goTo</code> only reads <code>.avenue</code> and

      { md: `<h2>Returning several answers at once</h2>
      <p>A function can <code>return</code> only one value. When you need it to report several things, make
      that one value an object.</p>
      <p><strong>Problem.</strong> The bottom row holds piles, some of them empty. Without disturbing them,
      build a report on street 2: on (1, 2) one beeper per non-empty pile, on (2, 2) the total number of
      beepers, and on (3, 2) the size of the biggest pile.</p>
      <p><code>survey</code> starts a <code>report</code> object with every count at 0 and updates its fields
      as it walks: <code>report.piles++</code> and <code>report.beepers = report.beepers + n</code> work on a
      field exactly the way they work on a variable. At the end it hands back all three counts in one
      <code>return</code>, and <code>main</code> reads them out by name.</p>` },
      { world: `Dimension: (6, 2)
Karel: (1, 1); east
BeeperBag: INFINITY
Beeper: (2, 1); 2
Beeper: (3, 1); 3
Beeper: (4, 1); 1
Beeper: (6, 1); 4`, code: `// Count the pile on this corner, then put it back as it was.
function countPile(k) {
  let n = 0;
  while (k.beepersPresent()) {
    k.pickBeeper();
    n++;
  }
  for (let i = 0; i < n; i++) {
    k.putBeeper();
  }
  return n;
}

function putMany(k, n) {
  for (let i = 0; i < n; i++) {
    k.putBeeper();
  }
}

function turnAround(k) {
  k.turnLeft();
  k.turnLeft();
}

function turnRight(k) {
  k.turnLeft();
  k.turnLeft();
  k.turnLeft();
}

// Walk the row east and describe it. Ends at the east wall.
function survey(k) {
  let report = { piles: 0, beepers: 0, biggest: 0 };
  let more = true;
  while (more) {
    let n = countPile(k);
    if (n > 0) {
      report.piles++;
      report.beepers = report.beepers + n;
    }
    if (n > report.biggest) {
      report.biggest = n;
    }
    more = k.frontIsClear();
    if (more) {
      k.move();
    }
  }
  return report;
}

function main(k) {
  let report = survey(k);  // { piles: 4, beepers: 10, biggest: 4 }

  // Back to the west wall, then up to street 2 facing east.
  turnAround(k);
  while (k.frontIsClear()) {
    k.move();
  }
  turnRight(k);
  k.move();
  turnRight(k);

  putMany(k, report.piles);
  k.move();
  putMany(k, report.beepers);
  k.move();
  putMany(k, report.biggest);
}` },

      // ─── Arrays of objects ───

      { md: `<h2>A list of records</h2>
      <p>Objects and arrays combine into the shape you'll reach for constantly: an <strong>array of
      objects</strong>. Each element is a record with the same keys, so the whole list reads like a
      table, where every object is a row and every key is a column:</p>
      <pre class="code">let orders = [
  { avenue: 2, street: 3, count: 1 },   // orders[0]
  { avenue: 5, street: 1, count: 3 },   // orders[1]
];

orders[1]          // { avenue: 5, street: 1, count: 3 }   a whole record
orders[1].count    // 3      record 1, then its count field
orders.length      // 2
orders.push({ avenue: 4, street: 4, count: 2 });   // add a record to the end</pre>
      <p>Read <code>orders[1].count</code> left to right, the same way you read <code>grid[r][c]</code>:
      first pick record 1, then pick the <code>count</code> field inside it. And <code>for…of</code> hands
      you one whole record at a time: <code>for (let order of orders)</code>.</p>` },

      { md: `<h3>Example · Make the deliveries</h3>
      <p><strong>Problem.</strong> Karel has a list of orders: each one says which corner to visit and how
      many beepers to leave there. Deliver them all, returning home between trips.</p>
      <p>Each order keeps its address and its count together, so they can never get out of step. And since
      every order has <code>.avenue</code> and <code>.street</code> fields, the order itself is a spot
      <code>goTo</code> can travel to. To take a new order, add one line to the list; the loop doesn't
      change.</p>` },

      { md: `<h3>Example · Find the biggest and the smallest</h3>
      <p><strong>Problem.</strong> Karel stands on an empty corner at the west end of the bottom row, and
      every corner east of it holds a pile, all different sizes. Paint the corner just above the biggest
      pile <strong>Green</strong> and the corner just above the smallest pile <strong>Red</strong>.</p>
      <p>Knowing the biggest <em>size</em> isn't enough; Karel needs to know <em>where</em> it was. So as it
      walks, Karel <code>push</code>es a record <code>{ avenue, size }</code> for every pile, building the
      list one record at a time. Then a loop keeps the best record seen so far. Because
      <code>biggest</code> holds a whole record, the winning pile's avenue comes along with it for
      free.</p>` },
      { world: `Dimension: (7, 2)
Karel: (1, 1); east
BeeperBag: INFINITY
Beeper: (2, 1); 3
Beeper: (3, 1); 1
Beeper: (4, 1); 4
Beeper: (5, 1); 6
Beeper: (6, 1); 2
Beeper: (7, 1); 5`, code: `// Count the pile on this corner, then put it back as it was.
function countPile(k) {
  let n = 0;
  while (k.beepersPresent()) {
    k.pickBeeper();
    n++;
  }
  for (let i = 0; i < n; i++) {
    k.putBeeper();
  }
  return n;
}

function turnRight(k) {
  k.turnLeft();
  k.turnLeft();
  k.turnLeft();
}

// From (1, 1) facing east, walk to (spot.avenue, spot.street), ending facing east.
function goTo(k, spot) {
  for (let i = 1; i < spot.avenue; i++) {
    k.move();
  }
  k.turnLeft();
  for (let i = 1; i < spot.street; i++) {
    k.move();
  }
  turnRight(k);
}

// From anywhere, facing any way, return to (1, 1) facing east.
function goHome(k) {
  while (!k.facingWest()) {
    k.turnLeft();
  }
  while (k.frontIsClear()) {
    k.move();
  }
  k.turnLeft();
  while (k.frontIsClear()) {
    k.move();
  }
  k.turnLeft();
}

function main(k) {
  // Walk the row, recording every pile as { avenue, size }.
  let piles = [];
  let avenue = 1;
  while (k.frontIsClear()) {
    k.move();
    avenue++;
    piles.push({ avenue: avenue, size: countPile(k) });
  }

  // Keep the best record seen so far.
  let biggest = piles[0];
  let smallest = piles[0];
  for (let pile of piles) {

    if (pile.size < smallest.size) {

    }

function readColor(k) {
  let candidates = ["Red", "Orange", "Yellow", "Green", "Blue", "Cyan", "Magenta", "Pink"];
  for (let i = 0; i < candidates.length; i++) {

    }
  }
  return "";

// Pick up the whole pile on this corner and return its size.

  let n = 0;
  while (k.beepersPresent()) {

    n++;
  }
  return n;

function turnAround(k) {
  k.turnLeft();
  k.turnLeft();
}

function main(k) {
  let row = [];
  // 1. record every corner as { color, size }, walking east

  // 2. back to the west wall, facing east

}`,

        solution: function main(k) {
          function readColor() {
            let candidates = ["Red", "Orange", "Yellow", "Green", "Blue", "Cyan", "Magenta", "Pink"];
            for (let i = 0; i < candidates.length; i++) {
              if (k.cornerColorIs(candidates[i])) {
                return candidates[i];

      // ─── Objects inside objects, and objects that are shared ───

      { md: `<h2>Objects inside objects</h2>
      <p>A field's value can be anything, including another object. That lets a record group its own
      details: a shape has a position and a size, and each of those is a little record of its own.</p>
      <pre class="code">let door = {
  at:    { avenue: 4, street: 1 },
  size:  { width: 1, height: 2 },
  color: "Dark Gray",
};

door.at              // { avenue: 4, street: 1 }   a whole position
door.at.avenue       // 4
door.size.height     // 2
goTo(k, door.at);    // door.at is a spot, so goTo can go there</pre>
      <p>Read <code>door.size.height</code> left to right: the door's <code>size</code>, then that size's
      <code>height</code>. Nesting pays off when the inner object is useful on its own, like
      <code>door.at</code> being handed straight to <code>goTo</code>.</p>
      <div class="callout"><strong>Two names, one object</strong>
      Assigning an object doesn't copy it. After <code>let b = a;</code>, <code>a</code> and <code>b</code>
      are two names for the <em>same</em> object, so <code>b.count = 5</code> also changes
      <code>a.count</code>. The same thing happens when you pass an object to a function: the parameter is
      another name for the caller's object, and any field the function changes stays changed after it
      returns. Numbers and strings don't behave this way; changing a number parameter never touches the
      caller's variable.</div>` },

        prompt: `The helpers are written for you. <code>nextCorner(k)</code> walks the grid row by row, west to
        east and bottom to top. <code>goTo(k, spot)</code> walks from (1, 1) to a spot, and
        <code>goHome(k)</code> comes back from anywhere. Pass one: two nested loops over
        <code>street</code> 1–3 and <code>avenue</code> 1–8; whenever <code>readColor(k)</code> isn't

function readColor(k) {
  let candidates = ["Red", "Orange", "Yellow", "Green", "Blue", "Cyan", "Magenta", "Pink"];
  for (let i = 0; i < candidates.length; i++) {
    if (k.cornerColorIs(candidates[i])) {
      return candidates[i];
    }
  }
  return "";
}

function turnAround(k) {
  k.turnLeft();
  k.turnLeft();
}

function turnRight(k) {
  k.turnLeft();
  k.turnLeft();
  k.turnLeft();
}

// Step to the next corner: west to east along a row, then up to the next row.
// Returns false (facing east on the top row's west end) when no corners are left.
function nextCorner(k) {
  if (k.frontIsClear()) {
    k.move();
    return true;
  }
  turnAround(k);
  while (k.frontIsClear()) {
    k.move();
  }
  turnRight(k);
  if (!k.frontIsClear()) {
    turnRight(k);
    return false;
  }
  k.move();
  turnRight(k);
  return true;
}

// From (1, 1) facing east, walk to (spot.avenue, spot.street), ending facing east.
function goTo(k, spot) {
  for (let i = 1; i < spot.avenue; i++) {
    k.move();
  }
  k.turnLeft();
  for (let i = 1; i < spot.street; i++) {
    k.move();
  }
  turnRight(k);
}

// From anywhere, facing any way, return to (1, 1) facing east.
function goHome(k) {
  while (!k.facingWest()) {
    k.turnLeft();
  }
  while (k.frontIsClear()) {
    k.move();
  }
  k.turnLeft();
  while (k.frontIsClear()) {
    k.move();
  }
  k.turnLeft();
}

function main(k) {
  let picture = [];

  // pass two: paint each record's copy 4 avenues to the east

        solution: function main(k) {
          function readColor() {
            let candidates = ["Red", "Orange", "Yellow", "Green", "Blue", "Cyan", "Magenta", "Pink"];
            for (let i = 0; i < candidates.length; i++) {
              if (k.cornerColorIs(candidates[i])) {
                return candidates[i];
              }
            }
            return "";
          }
          function turnRight() {
            k.turnLeft();
            k.turnLeft();
            k.turnLeft();
          }
          function nextCorner() {
            if (k.frontIsClear()) {
              k.move();
              return true;
            }
            k.turnLeft();
            k.turnLeft();
            while (k.frontIsClear()) k.move();
            turnRight();
            if (!k.frontIsClear()) {
              turnRight();
              return false;
            }
            k.move();
            turnRight();
            return true;
          }
          function goTo(spot) {
            for (let i = 1; i < spot.avenue; i++) k.move();
            k.turnLeft();
            for (let i = 1; i < spot.street; i++) k.move();
            turnRight();
          }
          function goHome() {
            while (!k.facingWest()) k.turnLeft();
            while (k.frontIsClear()) k.move();
            k.turnLeft();
            while (k.frontIsClear()) k.move();
            k.turnLeft();
          }
          let picture = [];
          for (let street = 1; street <= 3; street++) {
            for (let avenue = 1; avenue <= 8; avenue++) {
              let color = readColor();
              if (color !== "") {
                picture.push({ at: { avenue: avenue, street: street }, color: color });
              }
              nextCorner();
            }
          }
          goHome();
          for (let spot of picture) {
            goTo({ avenue: spot.at.avenue + 4, street: spot.at.street });
            k.paintCorner(spot.color);
            goHome();
          }
        } },

      { md: `<div class="callout tip"><strong>You learned</strong>
      An object bundles related values under names: <code>{ avenue: 3, color: "Red" }</code>. Read a field
      with a dot (<code>flag.color</code>), and assign to it to change it or add a new one. Passing one
      object instead of many parameters labels every value, and returning an object lets a function report
      several answers at once. An <strong>array of objects</strong> is a table of records, built with
      <code>push</code> and read as <code>list[i].field</code>, which keeps each row's details together. A
      field can hold another object (<code>shape.at.avenue</code>), and an object is shared, not copied:
      when a function changes a field of an object you handed it, the change is still there after it
      returns.</div>` },
