      { md: `<h2>Text is data too</h2>
      <p>A <strong>string</strong> is a piece of text — a run of characters wrapped in quotes:
      <code>"Karel"</code>, <code>"Red"</code>, <code>"go north"</code>. You can store one in a variable,
      compare it, glue strings together, measure it, cut pieces out of it, and search inside it. Strings are
      how a program holds names, labels, messages — and, as you'll see, tiny instructions.</p>
      <p>JavaScript accepts three kinds of quotes. The first two make exactly the same kind of value; the
      third, backticks, has an extra trick you'll meet below.</p>
      <pre class="code">"Karel"     // double quotes
'Karel'     // single quotes: the same string as "Karel"
\`Karel\`     // backticks: a template literal</pre>
      <p>The quote that opens a string must also close it. To put a quote character <em>inside</em> a string,
      either use the other kind of quote around it, or put a backslash in front of it — an
      <strong>escape</strong> that tells JavaScript "this quote is text, not the end of the string":</p>
      <pre class="code">"It's sunny"           // a ' inside "…" is fine
'She said "hi"'        // a " inside '…' is fine
"She said \\"hi\\""      // \\" is an escaped quote
"line one\\nline two"   // \\n is a new line</pre>
      <p>You've already used strings without noticing: every color name you paint with is one.</p>` },

      { md: `<h3>Slicing: taking more than one character</h3>
      <p>Square brackets get you <strong>exactly one character</strong>. To take a whole <em>piece</em> of a
      string, use <code>.slice</code>. The two look similar but answer different questions:</p>
      <ul>
        <li><strong>Indexing</strong> — <code>plan[2]</code> asks <em>"what character is at position 2?"</em>
        It gives back one character, or <code>undefined</code> if there is no position 2.</li>
        <li><strong>Slicing</strong> — <code>plan.slice(1, 4)</code> asks <em>"what text runs from position 1 up
        to position 4?"</em> It gives back a new string, which may be several characters, one, or none at
        all (<code>""</code>). The original string is not changed.</li>
      </ul>
      <p>The rule that trips everyone up at first: <code>slice(start, end)</code> includes
      <code>start</code> but <strong>stops just before</strong> <code>end</code>. Think of the numbers as
      the gaps <em>between</em> characters rather than the characters themselves:</p>
      <pre class="code">  R   G   B   Y   C
0   1   2   3   4   5

"RGBYC".slice(1, 4)   // "GBY" — cut at gap 1 and gap 4</pre>
      <p>A nice result of that rule: <code>end - start</code> is the length of the piece. <code>slice(1, 4)</code>
      is 3 characters long.</p>
      <p>There are a few common shapes of slice:</p>
      <pre class="code">let plan = "RGBYC";

plan[2]            // "B"     one character (indexing, not slicing)
plan.slice(1, 4)   // "GBY"   from index 1 up to, not including, 4
plan.slice(2)      // "BYC"   leave out end: from index 2 to the end
plan.slice(0, 2)   // "RG"    start at 0: the first 2 characters
plan.slice(-2)     // "YC"    negative counts from the end: the last 2
plan.slice(1, -1)  // "GBY"   drop the first and last character
plan.slice(3, 3)   // ""      start equals end: an empty string</pre>
      <p>Out-of-range numbers are forgiving with <code>slice</code>: <code>plan.slice(3, 99)</code> just
      stops at the end and gives <code>"YC"</code>. Indexing past the end, <code>plan[99]</code>, gives

      <p>Below, the plan <code>"RGBYC"</code> is painted along the bottom row in full. Each row above it

      <code>slice(-2)</code>.</p>` },

      { md: `<h3>Two things square brackets can't do</h3>
      <p><strong>1. Count from the end.</strong> <code>slice</code> understands negative numbers, but square
      brackets don't: <code>plan[-1]</code> is <code>undefined</code>, not the last character. To get the
      last character, either do the arithmetic yourself — <code>plan[plan.length - 1]</code> — or use
      <code>plan.at(-1)</code>. <code>.at</code> works like brackets but also accepts negative positions.</p>
      <p><strong>2. Change a character.</strong> Strings are <strong>immutable</strong>: once made, they never
      change. <code>plan[0] = "Y"</code> is an error in this course's code ("Cannot assign to read only
      property") — and in older, non-strict JavaScript it's silently ignored, which is worse. Either way,
      <code>plan</code> stays the same. To "change" a string, build a <em>new</em> one from pieces and store it
      back in the variable:</p>
      <pre class="code">plan = "Y" + plan.slice(1);   // "RGB" becomes "YGB"</pre>
      <p>That's also why <code>slice</code>, and the case methods you'll see below, always <em>return</em> a
      new string instead of altering the old one.</p>` },

      { md: `<h2>Building a string piece by piece</h2>

      { md: `<h2>Searching inside a string</h2>
      <p>Often you don't want a character at a known position — you want to know <em>whether</em> some text
      appears, or <em>where</em>. Strings have methods for that:</p>
      <pre class="code">let plan = "GRBYB";

plan.includes("Y")      // true    "Y" appears somewhere
plan.includes("C")      // false
plan.indexOf("B")       // 2       position of the FIRST "B"
plan.indexOf("BY")      // 2       works for longer text too
plan.indexOf("C")       // -1      -1 means "not found"
plan.startsWith("GR")   // true
plan.endsWith("Y")      // false   it ends with "B"</pre>
      <p><code>indexOf</code> returning <code>-1</code> is worth remembering: -1 can never be a real position,
      so it's JavaScript's way of saying "nowhere." Searching is case-sensitive, like everything else with
      strings — more on that in the next section.</p>
      <p>Below, the bottom row is painted from <code>"GRBYB"</code>. Karel uses <code>indexOf</code> to walk

      { md: `<h2>Upper case, lower case</h2>
      <p>To JavaScript, <code>"R"</code> and <code>"r"</code> are <em>different characters</em>. Strings are
      <strong>case-sensitive</strong>: <code>===</code> compares them character by character, so
      <code>"Blue" === "blue"</code> is <code>false</code>, and <code>"Blue".includes("b")</code> is
      <code>false</code> too. That matters any time text comes from a person, who might type
      <code>"BLUE"</code>, <code>"blue"</code>, or <code>"bLuE"</code>.</p>
      <p>Two methods make a <em>new</em> string with the case changed (the original is untouched, as
      always):</p>
      <pre class="code">"Blue".toUpperCase()   // "BLUE"
"Blue".toLowerCase()   // "blue"</pre>
      <p>Here's what that costs. The paint plan <code>"GbRbG"</code> was typed with some letters in lower
      case. The <code>paint</code> helper only knows the capitals <code>"R"</code>, <code>"G"</code>, and
      <code>"B"</code>, so on the <strong>bottom row</strong>, where Karel uses each letter exactly as
      typed, <code>"b" === "B"</code> is <code>false</code> and those corners stay blank.</p>
      <p>On the <strong>top row</strong>, Karel calls <code>.toUpperCase()</code> on each letter
      before handing it to <code>paint</code>. Now <code>"b"</code> becomes <code>"B"</code>, the
      comparison succeeds, and every corner gets painted. (Karel paints the top row walking west, so the
      plan reads the same in both directions.)</p>` },
      { world: `Dimension: (5, 2)
Karel: (1, 1); east
BeeperBag: INFINITY`, code: `function paint(k, code) {
  if (code === "R") k.paintCorner("Red");
  if (code === "G") k.paintCorner("Green");
  if (code === "B") k.paintCorner("Blue");
}

function main(k) {
  let plan = "GbRbG";

  // Bottom row: letters exactly as typed. "b" is not "B".
  for (let i = 0; i < plan.length; i++) {
    paint(k, plan[i]);
    if (k.frontIsClear()) {
      k.move();
    }
  }

  // Step up to the top row, facing west.
  k.turnLeft();
  k.move();
  k.turnLeft();

  // Top row: upper-case each letter first. "b" becomes "B".
  for (let i = 0; i < plan.length; i++) {
    paint(k, plan[i].toUpperCase());
    if (k.frontIsClear()) {
      k.move();
    }
  }
}` },

      Convert to one case, then compare. Here <code>"B"</code> is a capital we wrote ourselves, so only the

      { md: `<h3>Cleaning up typed text</h3>
      <p>Karel's color names are case-sensitive too: <code>paintCorner</code> accepts <code>"Green"</code>
      but not <code>"green"</code> or <code>"GREEN"</code>. Typed text often has stray spaces as well, and
      <code>"Green "</code> isn't a color either. Two tools fix that:</p>
      <ul>
        <li><code>.trim()</code> returns the string with spaces removed from both ends:
        <code>"  gREEN ".trim()</code> is <code>"gREEN"</code>. Spaces in the middle stay.</li>
        <li>A <code>capitalize</code> helper upper-cases the first character (<code>word[0]</code>),
        lower-cases the rest (<code>word.slice(1)</code>), and joins them.</li>
      </ul>
      <p>Watch out for the empty string: <code>""[0]</code> is <code>undefined</code>, and calling
      <code>.toUpperCase()</code> on <code>undefined</code> crashes the program. The helper below checks for
      that first.</p>
      <p>The first paint below works. The second paints <code>"GREEN"</code>, which isn't a Karel color, so
      the run stops with Karel drawn in red — on purpose, to show the cost of the wrong case.</p>` },

BeeperBag: INFINITY`, code: `function capitalize(word) {
  if (word.length === 0) {

  return word[0].toUpperCase() + word.slice(1).toLowerCase();
}

function main(k) {
  let typed = "  gREEN ";
  k.paintCorner(capitalize(typed.trim()));    // "Green" works
  k.turnLeft();

      <ul>
        <li>A string is text in <code>"double"</code>, <code>'single'</code>, or <code>\`back\`</code> quotes;

        <li><code>.length</code> counts characters; <code>""</code> is the empty string, length 0.</li>
        <li><code>+</code> joins strings, and a template literal fills in values:
        <code>\`\${shade} Gray\`</code>.</li>
        <li><code>str[i]</code> reads <em>one</em> character, counting from 0; <code>str.at(-1)</code> reads

        <code>end</code>.</li>
        <li>Strings are immutable: you never change one, you build a new one — often starting from
        <code>""</code> and adding with <code>+=</code>.</li>
