<body>
  <header class="course">
    <div class="crumb">Learning JavaScript with Karel · Lesson 5 of 10</div>
    <h1>5 · Making Decisions with <code>if</code></h1>
    <p class="lead">Run some commands only when a condition is true.</p>
  </header>

  <main id="notebook"></main>

  <nav class="pager">
    <a href="./04-while-loops.html">← while loops</a><span class="spacer"></span><a href="./06-if-else.html">if / else →</a>
  </nav>

  <script type="module">
    import { renderNotebook } from "./lesson.js";

    const cells = [
      { md: `<h2>Conditions are true or false</h2>
      <p>A <strong>condition</strong> is a question with a yes/no answer. In JavaScript, "yes" is
      <code>true</code> and "no" is <code>false</code> — these are called <strong>booleans</strong>.
      Karel's sensors answer such questions, for example <code>k.beepersPresent()</code>, which is
      <code>true</code> when there's a beeper on the current square.</p>` },
      { md: `<h2>The <code>if</code> statement</h2>
      <p>An <code>if</code> statement runs its block <em>only</em> when the condition is true. This
      matters here: <code>k.pickBeeper()</code> crashes if there's no beeper to pick up. Guarding it with
      <code>if (k.beepersPresent())</code> makes Karel pick up beepers safely, skipping empty squares.</p>` },
      { world: `Dimension: (6, 1)
Karel: (1, 1); east
BeeperBag: 0
Beeper: (2, 1); 1
Beeper: (4, 1); 1
Beeper: (5, 1); 1`, code: function main(k) {
          for (let i = 0; i < 5; i++) {
            if (k.beepersPresent()) {
              k.pickBeeper();
            }
            k.move();
          }
          if (k.beepersPresent()) {
            k.pickBeeper();
          }
      } },
      { md: `<h2>A single decision</h2>
      <p>An <code>if</code> doesn't need a loop around it. Here Karel walks to one particular square and
      makes a single decision there: pick up a beeper if — and only if — one is present.</p>` },
      { world: `Dimension: (5, 1)
Karel: (1, 1); east
BeeperBag: 0
Beeper: (3, 1); 1`, code: function main(k) {
          k.move();
          k.move();
          if (k.beepersPresent()) {
            k.pickBeeper();
          }
          k.move();
      } },
      { md: `<div class="callout tip"><strong>You learned</strong>
      An <code>if</code> statement runs its block only when a condition is <code>true</code>. Conditions
      are booleans (<code>true</code>/<code>false</code>). Use <code>if</code> to guard commands that
      would otherwise fail, like picking up a beeper that isn't there.</div>` },
    ];

    renderNotebook(cells);
  </script>
