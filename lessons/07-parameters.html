      <p>Every function you wrote in Lesson 2 did exactly one thing, the same way, every time.

      just with one number baked in that happens to fit a single spot in your program.</p>
      <p>A <strong>parameter</strong> fixes that. It is a named input listed inside the function's
      parentheses, and it lets the caller decide the detail that changes — how far, how many, how tall —
      each time the function is used. The function stops being pre-configured for one circumstance and
      becomes a tool you can apply anywhere.</p>

      <p>Two words describe the two sides of this hand-off. Inside the function definition, the name in
