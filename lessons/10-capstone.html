<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>10 · Putting It All Together — Karel JS</title>
  <style>
    :root{
      --ink:#1a1a1a; --muted:#666; --line:#e5e7eb;
      --in-bg:#f6f8fa; --in-border:#d0d7de; --prompt:#8a3ffc; --accent:#0b5fff;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
      color:var(--ink);background:#fafafa;margin:0;line-height:1.6;}
    .course{max-width:52rem;margin:0 auto;padding:2.5rem 1.25rem 0.25rem;}
    .crumb{font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
    .course h1{margin:.3rem 0 .4rem;font-size:1.9rem;line-height:1.15;}
    .course .lead{margin:0;color:var(--muted);font-size:1.08rem;}
    #notebook{max-width:52rem;margin:1rem auto;padding:0 1.25rem;}
    .md{padding:.3rem 0 .1rem;}
    .md h2{font-size:1.32rem;margin:1.5rem 0 .5rem;}
    .md h3{font-size:1.06rem;margin:1.1rem 0 .35rem;}
    .md p{margin:.5rem 0;}
    .md code{background:#eef1f4;padding:.1em .35em;border-radius:4px;font-size:.92em;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
    .md .callout{border-left:4px solid var(--accent);background:#eef4ff;padding:.6rem .9rem;
      border-radius:0 6px 6px 0;margin:.85rem 0;}
    .md .callout.tip{border-color:#16a34a;background:#effaf1;}
    .md .callout.warn{border-color:#d97706;background:#fff7ed;}
    .md .callout strong{display:block;margin-bottom:.15rem;}
    .md ul{margin:.4rem 0 .4rem 1.15rem;} .md li{margin:.2rem 0;}
    .cell{margin:1rem 0 1.5rem;}
    .in,.out{display:flex;gap:.55rem;align-items:flex-start;}
    .prompt{flex:0 0 auto;width:4rem;text-align:right;font-family:ui-monospace,monospace;
      font-size:.78rem;color:var(--prompt);padding-top:.6rem;user-select:none;}
    .out-prompt{color:#d1451b;}
    pre.code{flex:1 1 auto;margin:0;background:var(--in-bg);border:1px solid var(--in-border);
      border-radius:6px;padding:.6rem .85rem;overflow-x:auto;}
    pre.code code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-size:.9rem;line-height:1.55;color:#24292f;white-space:pre;}
    .kw{color:#cf222e;} .st{color:#0a3069;} .cm{color:#6e7781;font-style:italic;} .nm{color:#0550ae;}
    .out{margin-top:.45rem;}
    .render{flex:1 1 auto;min-height:56px;padding-top:.25rem;}
    .render img{border:1px solid var(--line);border-radius:4px;background:#fff;max-width:100%;}
    .status{color:#999;font-size:.9rem;font-style:italic;}
    .err{color:#b91c1c;font-size:.85rem;margin-top:.4rem;font-family:ui-monospace,monospace;}
    .pager{max-width:52rem;margin:2rem auto 3rem;padding:1.2rem 1.25rem 0;
      border-top:1px solid var(--line);display:flex;justify-content:space-between;
      gap:1rem;font-size:.95rem;}
    .pager a{color:var(--accent);text-decoration:none;font-weight:500;}
    .pager a:hover{text-decoration:underline;} .pager .spacer{flex:1;}
  </style>
</head>
<body>
  <header class="course">
    <div class="crumb">Learning JavaScript with Karel · Lesson 10 of 10</div>
    <h1>10 · Putting It All Together</h1>
    <p class="lead">Nested loops and everything so far, working as one program to plant a whole field.</p>
  </header>

  <main id="notebook"></main>

  <nav class="pager">
    <a href="./09-booleans-return.html">← Return values</a><span class="spacer"></span><span></span>
  </nav>

  <script type="module">
    import { runKarel } from "https://esm.sh/stanfordkarel-js-notebooks@0.4.0/stanfordkarel.js";

    const cells = [
      { md: `<h2>The goal</h2>
      <p>Let's plant a beeper on <em>every</em> square of a grid. This calls for a <strong>nested
      loop</strong> — a loop inside another loop — plus functions, conditions, and a variable. Everything
      from the previous nine lessons comes together here.</p>` },
      { md: `<h2>Step 1: plant one row</h2>
      <p>First a helper. <code>plantRow</code> uses a while loop to lay a beeper on each square across a
      row until it reaches the wall. Because it stops at a wall on its own, it works for a row of any
      length.</p>` },
      { world: `Dimension: (4, 4)
Karel: (1, 1); east
BeeperBag: INFINITY`, code: function main(k) {
          function plantRow() {
            while (k.frontIsClear()) {
              k.putBeeper();
              k.move();
            }
            k.putBeeper();
          }
          
          plantRow();
      } },
      { md: `<h2>Step 2: every row, snaking up</h2>
      <p>Now the outer loop. After planting a row, Karel steps up to the next one and reverses direction,
      snaking back and forth so it never has to backtrack. A <code>facingEast</code> variable remembers
      which way Karel is pointing, and <code>if</code> / <code>else</code> picks the right turns.</p>
      <p>This one program uses <strong>functions</strong> (Lesson 2), a <strong>for loop</strong> (3), a
      <strong>while loop</strong> (4), <strong>if / else</strong> (5–6), and a <strong>variable</strong>
      (8) — all at once.</p>` },
      { world: `Dimension: (4, 4)
Karel: (1, 1); east
BeeperBag: INFINITY`, code: function main(k) {
          function turnRight() {
            k.turnLeft();
            k.turnLeft();
            k.turnLeft();
          }
          
          function plantRow() {
            while (k.frontIsClear()) {
              k.putBeeper();
              k.move();
            }
            k.putBeeper();
          }
          
          let facingEast = true;
          for (let row = 0; row < 4; row++) {
            plantRow();
            if (row < 3) {
              if (facingEast) {
                k.turnLeft();
                k.move();
                k.turnLeft();
              } else {
                turnRight();
                k.move();
                turnRight();
              }
              facingEast = !facingEast;
            }
          }
      }, opts: { cellSize: 46, delay: 110 } },
      { md: `<div class="callout tip"><strong>You did it</strong>
      You've gone from a single <code>k.move()</code> to a program that decomposes a big task into
      functions, repeats work with loops, makes decisions with conditions, and remembers state in a
      variable. That's the core of programming — and it's the same JavaScript used to build real
      software.</div>
      <p>From here, try changing the numbers and worlds in your head and predicting the result, then
      imagine how you'd teach Karel to <em>harvest</em> the field by picking every beeper back up.</p>` },
    ];

    const esc = s => s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));

    function highlight(src) {
      return src.split(/(\/\/[^\n]*|`[^`]*`|"[^"]*"|'[^']*')/g).map((p, i) => {
        if (i % 2 === 1) return `<span class="${p.startsWith("//") ? "cm" : "st"}">${esc(p)}</span>`;
        let h = esc(p);
        h = h.replace(/\b(function|for|while|if|else|let|const|return|true|false|new)\b/g, '<span class="kw">$1</span>');
        h = h.replace(/\b(\d+)\b/g, '<span class="nm">$1</span>');
        return h;
      }).join("");
    }

    function dedent(s) {
      const lines = s.replace(/^\n+/, "").replace(/\s+$/, "").split("\n");
      const widths = lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length);
      const min = widths.length ? Math.min(...widths) : 0;
      return lines.map(l => l.slice(min)).join("\n");
    }

    function bodySource(fn) {
      const s = fn.toString();
      return dedent(s.slice(s.indexOf("{") + 1, s.lastIndexOf("}")));
    }

    let counter = 0;
    const nb = document.getElementById("notebook");

    function renderMd(cell) {
      const div = document.createElement("div");
      div.className = "md";
      div.innerHTML = cell.md;
      nb.appendChild(div);
    }

    async function renderCode(cell) {
      const n = ++counter;
      const wrap = document.createElement("div");
      wrap.className = "cell";
      wrap.innerHTML =
        `<div class="in"><div class="prompt">In [${n}]:</div>` +
        `<pre class="code"><code>${highlight(bodySource(cell.code))}</code></pre></div>` +
        `<div class="out"><div class="prompt out-prompt">Out[${n}]:</div>` +
        `<div class="render"><span class="status">Running…</span></div></div>`;
      nb.appendChild(wrap);
      const render = wrap.querySelector(".render");
      try {
        const img = await runKarel(cell.world, cell.code, cell.opts || { cellSize: 46, delay: 150 });
        render.replaceChildren(img);
        if (img.dataset.error) {
          const e = document.createElement("div");
          e.className = "err";
          e.textContent = "Karel stopped early: " + img.dataset.error;
          render.appendChild(e);
        }
      } catch (err) {
        render.innerHTML = `<div class="err">Error: ${esc(err.message)}</div>`;
      }
    }

    for (const cell of cells) {
      if (cell.md !== undefined) renderMd(cell);
      else await renderCode(cell);
    }
  </script>
</body>
</html>
