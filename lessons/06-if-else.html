      { md: `<h2>This <em>or</em> that</h2>
      <p>Often you want one action when a condition is true and a <em>different</em> action when it's
      false. That's what <code>else</code> is for: <code>if</code> handles the true case, <code>else</code>
      handles everything else. Exactly one of the two blocks runs.</p>
      <div class="callout"><strong>Anatomy of an if / else</strong>
      <code>if (condition) { …A… } else { …B… }</code><br>
      • when the condition is <code>true</code>, block A runs and block B is skipped<br>
      • when it's <code>false</code>, block A is skipped and block B runs<br>
      • there is no third possibility — one of the two <em>always</em> runs</div>` },

      { md: `<h2>More than two choices: <code>else if</code></h2>
      <p>Sometimes there are more than two cases. You could nest an <code>if</code> inside an
      <code>else</code>, but JavaScript has a cleaner way to write it: a chain of <code>else if</code>
      branches, optionally ending in a plain <code>else</code>.</p>
      <div class="callout"><strong>Anatomy of an if / else if / else chain</strong>
      <code>if (c1) { …A… } else if (c2) { …B… } else if (c3) { …C… } else { …D… }</code><br>
      • the conditions are tested <strong>top to bottom</strong><br>
      • the block of the <strong>first</strong> condition that is <code>true</code> runs; everything
      below it is skipped<br>
      • the final <code>else</code> runs only when <em>none</em> of the conditions were true — and it's
      optional: leave it out and the chain does nothing when nothing matches</div>
      <p>Here's a stock-room job. Karel snakes through a room of colored corners and stocks each one by
      color: <strong>6</strong> beepers on a <span style="color:#c00">red</span> corner, <strong>3</strong>

      { md: `<p>A corner has only one color, so in this chain at most one condition can be true and the order

      { md: `<h2>Order matters: the first true branch wins</h2>
      <p>Because the chain stops at the first <code>true</code> condition, an <code>else if</code> branch

      never gets a chance to run. So write the chain in <strong>priority order</strong>: the rule that

      <p>Watch it happen. Karel starts at <strong>(1, 1)</strong> facing north and hunts for a beeper at

      <ol>

        <li>else if the <strong>front</strong> is clear, step;</li>
        <li>else turn left.</li>
      </ol>
      <p>At the very first corner rules 1 <em>and</em> 2 are both true — Karel's right (east) and front
      (north) are both open. Rule 1 is listed first, so it wins: Karel turns east straight away and

      { md: `<h2>Priority at work: restock only the empty corners</h2>

      { md: `<div class="callout tip"><strong>You learned</strong>
      <code>if (condition) { … } else { … }</code> chooses between two actions: the first block runs when
      the condition is true, the second when it's false. Exactly one branch always runs.
      <code>else if</code> extends the choice to many cases: the conditions are tested top to bottom, the
      <strong>first true one runs and the rest are skipped</strong>. When conditions can overlap, that makes
