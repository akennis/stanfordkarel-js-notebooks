<head>

<body>
  <header class="course">
    <div class="crumb">Learning JavaScript with Karel · Lesson 3 of 10</div>
    <h1>3 · The <code>for</code> Loop</h1>
    <p class="lead">Repeat a command a fixed number of times without writing it out over and over.</p>
  </header>

  <main id="notebook"></main>

  <nav class="pager">
    <a href="./02-functions.html">← Functions</a><span class="spacer"></span><a href="./04-while-loops.html">while loops →</a>
  </nav>

  <script type="module">
    import { renderNotebook } from "./lesson.js";

    const cells = [
      { md: `<h2>Repetition, the hard way</h2>
      <p>To cross five squares, we could write <code>k.move()</code> five times. That works, but what
      about fifty squares? Copy-pasting is tedious and error-prone.</p>` },
      { world: `Dimension: (6, 1)
Karel: (1, 1); east
BeeperBag: INFINITY`, code: function main(k) {
          k.move();
          k.move();
          k.move();
          k.move();
          k.move();
      } },
      { md: `<h2>The <code>for</code> loop</h2>
      <p>A <strong>for loop</strong> repeats code a set number of times. Read this one as: "start a
      counter <code>i</code> at 0; keep going while <code>i</code> is less than 5; add 1 to <code>i</code>
      each time." That's exactly 5 repetitions.</p>
      <div class="callout"><strong>Anatomy of a for loop</strong>
      <code>for (let i = 0; i &lt; 5; i++) { … }</code><br>
      • <code>let i = 0</code> — start the counter<br>
      • <code>i &lt; 5</code> — the condition to keep looping<br>
      • <code>i++</code> — add one to the counter after each pass</div>` },
      { world: `Dimension: (6, 1)
Karel: (1, 1); east
BeeperBag: INFINITY`, code: function main(k) {
          for (let i = 0; i < 5; i++) {
            k.move();
          }
      } },
      { md: `<h2>Doing more each time</h2>
      <p>Anything inside the curly braces repeats. Here Karel lays a beeper <em>and</em> moves on every
      pass, leaving a neat trail. Change the <code>5</code> and the whole behaviour changes with it.</p>` },
      { world: `Dimension: (6, 1)
Karel: (1, 1); east
BeeperBag: INFINITY`, code: function main(k) {
          for (let i = 0; i < 5; i++) {
            k.putBeeper();
            k.move();
          }
          k.putBeeper();
      } },
      { md: `<div class="callout tip"><strong>You learned</strong>
      Use a <code>for</code> loop to repeat code a known number of times. The number after
      <code>i &lt;</code> controls how many passes run. Everything inside <code>{ }</code> happens on
      every pass.</div>` },
    ];

    renderNotebook(cells);
  </script>
</body>
