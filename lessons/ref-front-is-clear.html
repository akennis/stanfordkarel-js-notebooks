<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>k.frontIsClear() — Karel Reference</title>
  <link rel="stylesheet" href="lesson.css">
</head>
<body>
  <header class="course">
    <div class="crumb">Karel Reference · Condition</div>
    <h1><code>k.frontIsClear()</code></h1>
    <p class="lead">Ask whether the square directly ahead is open (no wall, no edge).</p>
  </header>

  <main id="notebook"></main>

  <script type="module">
    import { renderNotebook } from "./lesson.js";

    const cells = [
      { md: `<h2>What it does</h2>
      <p><code>k.frontIsClear()</code> is a <strong>condition</strong>: it answers a yes/no question and
      returns a boolean (<code>true</code> or <code>false</code>) without changing anything. It is
      <code>true</code> when Karel could <code>move()</code> forward — the square ahead is inside the
      world and no wall blocks the way — and <code>false</code> when a wall or the world's edge is
      directly in front.</p>
      <p>Its opposite is <code>k.frontIsBlocked()</code>, which is simply <code>true</code> whenever
      <code>frontIsClear()</code> is <code>false</code>. Use whichever reads more naturally.</p>
      <p>Conditions like this are what you put inside an <code>if</code> or a <code>while</code>:</p>
      <pre class="code"><code>while (k.frontIsClear()) {
  k.move();
}</code></pre>
      <p><strong>See also:</strong> <a href="./ref-left-is-clear.html"><code>leftIsClear()</code></a> and
      <a href="./ref-right-is-clear.html"><code>rightIsClear()</code></a> check the sides;
      <a href="./ref-move.html"><code>move()</code></a> is the action this usually guards.</p>` },

      { md: `<h2>Simple example</h2>
      <p>The classic use: walk forward until a wall stops you. As long as the front is clear, take a
      step. Karel starts at the west end of a one-street world and marches to the east wall.</p>` },
      { world: `Dimension: (5, 1)
Karel: (1, 1); east`, code: `function main(k) {
  while (k.frontIsClear()) {
    k.move();
  }
}` },
      { md: `<p>At <code>(1,1)</code> through <code>(4,1)</code> the front is clear, so Karel keeps
      stepping. At <code>(5, 1)</code> the world's edge is ahead, <code>frontIsClear()</code> is
      <code>false</code>, and the loop stops. Karel never crashes into the wall.</p>` },

      { md: `<h2>Complex example</h2>
      <p><code>frontIsClear()</code> notices interior walls too, not just the world's edge. Here a wall
      sits on the east side of <code>(3, 3)</code>. Karel walks east until that wall blocks it, turns
      left, then walks north until the top edge stops it — an "L" path decided entirely by the
      condition.</p>` },
      { world: `Dimension: (5, 5)
Karel: (1, 3); east
Wall: (3, 3); east`, code: `function main(k) {
  while (k.frontIsClear()) {
    k.move();
  }
  k.turnLeft();
  while (k.frontIsClear()) {
    k.move();
  }
}` },
      { md: `<p>The first loop stops at <code>(3, 3)</code> because the wall makes the front blocked. After
      <code>turnLeft</code> Karel faces north, where the front is clear again, so the second loop climbs
      to <code>(3, 5)</code>. The same condition drove both stops.</p>` },

      { md: `<h2>Challenges</h2>` },

      { world: `Dimension: (6, 1)
Karel: (1, 1); east`,
        prompt: `<strong>Walk to the wall.</strong> Send Karel east until it reaches the far wall,
        finishing on <code>(6, 1)</code> — but you don't know the width in advance, so use
        <code>frontIsClear()</code> in a <code>while</code> loop rather than counting steps.`,
        check: ["position"],
        solution: function main(k) {
          while (k.frontIsClear()) {
            k.move();
          }
        } },

      { world: `Dimension: (4, 4)
Karel: (1, 1); east`,
        prompt: `<strong>Follow two walls.</strong> Walk east until blocked, then turn left and walk north
        until blocked. Karel should finish in the top-right corner <code>(4, 4)</code> facing north. Use
        <code>frontIsClear()</code> loops so it works whatever the size.`,
        check: ["position", "direction"],
        solution: function main(k) {
          while (k.frontIsClear()) {
            k.move();
          }
          k.turnLeft();
          while (k.frontIsClear()) {
            k.move();
          }
        } },

      { md: `<div class="callout tip"><strong>Summary</strong>
      <code>k.frontIsClear()</code> returns <code>true</code> when the square ahead is open and
      <code>false</code> at a wall or edge; <code>frontIsBlocked()</code> is its opposite. Pair it with a
      <code>while</code> loop to move safely without counting steps.</div>` },
    ];

    renderNotebook(cells, undefined, { isolate: true });
  </script>
