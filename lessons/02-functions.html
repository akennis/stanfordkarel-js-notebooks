<body>
  <header class="course">
    <div class="crumb">Learning JavaScript with Karel · Lesson 2 of 10</div>
    <h1>2 · Functions</h1>
    <p class="lead">Teach Karel a new word by bundling commands into a function you can reuse.</p>
  </header>

  <main id="notebook"></main>

  <nav class="pager">
    <a href="./01-commands.html">← Commands</a><span class="spacer"></span><a href="./03-for-loops.html">for loops →</a>
  </nav>

  <script type="module">
    import { renderNotebook } from "./lesson.js";

    const cells = [
      { md: `<h2>Karel can't turn right</h2>
      <p>Karel only knows <code>turnLeft()</code>. To turn <em>right</em>, Karel has to turn left three
      times (left + left + left = right). It works, but it's noisy and easy to get wrong.</p>` },
      { world: `Dimension: (5, 5)
Karel: (1, 1); north
BeeperBag: INFINITY`, code: function main(k) {
          k.move();
          k.move();
          k.turnLeft();
          k.turnLeft();
          k.turnLeft();
          k.move();
      } },
      { md: `<h2>Define your own command</h2>
      <p>A <strong>function</strong> lets you give a name to a group of commands, so you can use that
      name as if it were a brand-new command. This is how we teach Karel the word <code>turnRight</code>:</p>
      <div class="callout"><strong>The shape of a function</strong>
      <code>function name() { ...commands... }</code> — the word <code>function</code>, a name you choose,
      empty <code>()</code>, then the commands in curly braces <code>{ }</code>. Defining a function does
      <em>not</em> run it; you run it later by <em>calling</em> it: <code>turnRight();</code></div>` },
      { world: `Dimension: (5, 5)
Karel: (1, 1); north
BeeperBag: INFINITY`, code: function main(k) {
          function turnRight() {
            k.turnLeft();
            k.turnLeft();
            k.turnLeft();
          }
          
          k.move();
          k.move();
          turnRight();
          k.move();
          k.move();
      } },
      { md: `<h2>Why functions are worth it</h2>
      <p>Functions let you say <em>what</em> you mean instead of <em>how</em> to do it. Once
      <code>dropAndGo</code> exists, the main program reads like plain English — and if you ever change
      how it works, you only change it in one place.</p>` },
      { world: `Dimension: (5, 5)
Karel: (1, 1); east
BeeperBag: INFINITY`, code: function main(k) {
          function dropAndGo() {
            k.putBeeper();
            k.move();
          }
          
          dropAndGo();
          dropAndGo();
          dropAndGo();
          dropAndGo();
      } },
      { md: `<div class="callout tip"><strong>You learned</strong>
      A function gives a name to a sequence of commands. <em>Define</em> it once with
      <code>function name() { … }</code>, then <em>call</em> it as many times as you like with
      <code>name();</code>. Good function names describe the job, which makes programs easier to read.</div>` },
    ];

    renderNotebook(cells);
  </script>
</body>
