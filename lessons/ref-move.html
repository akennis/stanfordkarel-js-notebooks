<!DOCTYPE html>
<html lang="en">
<head>

  <title>k.move() — Karel Reference</title>
  <link rel="stylesheet" href="lesson.css">

<body>
  <header class="course">
    <div class="crumb">Karel Reference · Command</div>
    <h1><code>k.move()</code></h1>
    <p class="lead">Move Karel one square forward in the direction it is currently facing.</p>
  </header>

  <main id="notebook"></main>

  <nav class="pager">
    <a href="./reference.html">← All reference pages</a><span class="spacer"></span>
    <a href="./ref-turn-left.html">k.turnLeft() →</a>
  </nav>

  <script type="module">
    import { renderNotebook } from "./lesson.js";

    const cells = [
      { md: `<h2>What it does</h2>
      <p><code>k.move()</code> advances Karel exactly one square in the direction it is currently
      facing. It does <strong>not</strong> turn Karel — the facing direction is unchanged. Karel keeps
      whatever it was carrying and standing on; only its position changes.</p>
      <div class="callout warn"><strong>Careful</strong>
      Karel cannot move through a wall or off the edge of the world. Trying to do so is an error: Karel
      stops and the corner is marked in red. Use <code>k.frontIsClear()</code> first if you are not sure
      the way is open.</div>
      <p><strong>See also:</strong> <a href="./ref-front-is-clear.html"><code>frontIsClear()</code></a>
      to check before moving, and <a href="./ref-turn-left.html"><code>turnLeft()</code></a> to change
      direction.</p>` },

      { md: `<h2>Simple example</h2>
      <p>Karel starts on the south-west corner facing east. Three <code>move</code> commands carry it
      three squares to the right, still facing east, finishing on <code>(4, 1)</code>.</p>` },
      { world: `Dimension: (5, 5)
Karel: (1, 1); east`, code: `function main(k) {
  k.move();
  k.move();
  k.move();
}` },
      { md: `<p>Each line is one step. Because Karel began at avenue 1 and never turned, three steps east
      land it at avenue <code>1 + 3 = 4</code>.</p>` },

      { md: `<h2>Complex example</h2>
      <p><code>move</code> always follows Karel's <em>current</em> direction, so combining it with
      <code>turnLeft</code> lets Karel trace any path. Here Karel walks along three sides of a 4×4 world,
      turning left at each corner.</p>` },
      { world: `Dimension: (4, 4)
Karel: (1, 1); east`, code: `function main(k) {
  k.move();
  k.move();
  k.move();
  k.turnLeft();
  k.move();
  k.move();
  k.move();
  k.turnLeft();
  k.move();
  k.move();
  k.move();
}` },
      { md: `<p>The first three moves go east to <code>(4, 1)</code>; a left turn faces Karel north and the
      next three moves climb to <code>(4, 4)</code>; another left turn faces it west and the last three
      moves finish at <code>(1, 4)</code>. Same command every time — the direction is what changed.</p>` },

      { md: `<h2>Challenges</h2>` },

      { world: `Dimension: (6, 1)
Karel: (1, 1); east`,
        prompt: `<strong>Walk to the end.</strong> Karel is on a one-street world, on corner
        <code>(1, 1)</code> facing east. Move it all the way to the far corner <code>(6, 1)</code>.
        (How many steps is that?)`,
        check: ["position"],
        solution: function main(k) {
          k.move(); k.move(); k.move(); k.move(); k.move();
        } },

      { world: `Dimension: (5, 5)
Karel: (1, 1); east`,
        prompt: `<strong>Cross to the far corner.</strong> Get Karel from <code>(1, 1)</code> to the
        opposite corner <code>(5, 5)</code>. Karel only moves forward, so you'll need a
        <code>k.turnLeft()</code> somewhere in the middle to change direction.`,
        check: ["position"],
        solution: function main(k) {
          k.move(); k.move(); k.move(); k.move();
          k.turnLeft();
          k.move(); k.move(); k.move(); k.move();
        } },

      { md: `<div class="callout tip"><strong>Summary</strong>
      <code>k.move()</code> takes one step forward in the current direction and never turns. It fails at
      a wall or the world's edge, so check <code>frontIsClear()</code> when in doubt.</div>` },
    ];

    renderNotebook(cells, undefined, { isolate: true });
  </script>
</body>
