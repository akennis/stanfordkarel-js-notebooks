<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>k.facingWest() — Karel Reference</title>
  <link rel="stylesheet" href="lesson.css">
</head>
<body>
  <header class="course">
    <div class="crumb">Karel Reference · Condition</div>
    <h1><code>k.facingWest()</code></h1>
    <p class="lead">Ask whether Karel is currently facing west.</p>
  </header>

  <main id="notebook"></main>

  <script type="module">
    import { renderNotebook } from "./lesson.js";

    const cells = [
      { md: `<h2>What it does</h2>
      <p><code>k.facingWest()</code> returns <code>true</code> when Karel is pointing west and
      <code>false</code> otherwise. It only reports the direction; it never turns Karel. (West is
      "left" on the grid, toward lower avenue numbers.)</p>
      <p>Its opposite is <code>k.notFacingWest()</code> (<code>true</code> when Karel points any other
      way), which drives the "turn until facing west" idiom below.</p>
      <p><strong>See also:</strong> the sibling conditions
      <a href="./ref-facing-north.html"><code>facingNorth()</code></a>,
      <a href="./ref-facing-east.html"><code>facingEast()</code></a>,
      <a href="./ref-facing-south.html"><code>facingSouth()</code></a>.</p>` },

      { md: `<h2>Simple example</h2>
      <p>Karel is placed facing west, so the <code>if</code> is true and it drops a beeper to confirm.</p>` },
      { world: `Dimension: (5, 5)
Karel: (3, 1); west
BeeperBag: INFINITY`, code: `function main(k) {
  if (k.facingWest()) {
    k.putBeeper();
  }
}` },
      { md: `<p>Karel is facing west, so a beeper lands on <code>(3, 1)</code>.</p>` },

      { md: `<h2>Complex example</h2>
      <p>Turn until Karel faces west, whatever its start. Keep turning left <em>while</em> it's not yet
      facing west. Here Karel begins facing east and needs two left turns to reverse to west.</p>` },
      { world: `Dimension: (5, 5)
Karel: (1, 1); east`, code: `function main(k) {
  while (k.notFacingWest()) {
    k.turnLeft();
  }
}` },
      { md: `<p>East → north → west: two left turns and the loop stops. The same loop straightens Karel out
      from any starting direction.</p>` },

      { md: `<h2>Challenges</h2>` },

      { world: `Dimension: (5, 5)
Karel: (3, 1); north`,
        prompt: `<strong>Face west.</strong> Karel starts facing north. Turn it so it faces west. (One
        left turn will do it.)`,
        check: ["direction"],
        solution: function main(k) {
          k.turnLeft();
        } },

      { world: `Dimension: (5, 5)
Karel: (3, 1); south`,
        prompt: `<strong>Face west from anywhere.</strong> Karel starts facing south here — but write code
        that ends facing west <strong>regardless</strong> of the starting direction, using a
        <code>while</code> loop with <code>notFacingWest()</code>.`,
        check: ["direction"],
        solution: function main(k) {
          while (k.notFacingWest()) {
            k.turnLeft();
          }
        } },

      { md: `<div class="callout tip"><strong>Summary</strong>
      <code>k.facingWest()</code> reports whether Karel points west; <code>notFacingWest()</code> is its
      opposite. Loop <code>while (k.notFacingWest()) k.turnLeft();</code> to face west from any start.</div>` },
    ];

    renderNotebook(cells, undefined, { isolate: true });
  </script>

  <script type="module" src="../site-nav.js"></script>
</body>
