<body>
  <header class="course">
    <div class="crumb">Learning JavaScript with Karel · Lesson 4 of 10</div>
    <h1>4 · The <code>while</code> Loop</h1>
    <p class="lead">Repeat until a condition changes — even when you don't know the count ahead of time.</p>
  </header>

  <main id="notebook"></main>

  <nav class="pager">
    <a href="./03-for-loops.html">← for loops</a><span class="spacer"></span><a href="./05-if.html">if statements →</a>
  </nav>

  <script type="module">
    import { runKarel } from "https://esm.sh/stanfordkarel-js-notebooks@0.4.0/stanfordkarel.js";

    const cells = [
      { md: `<h2>When you don't know how far</h2>
      <p>A <code>for</code> loop is perfect when you know the count. But what if Karel should walk to a
      wall that might be near or far? For that we use a <strong>while loop</strong>, which keeps going
      <em>as long as a condition is true</em>.</p>
      <p>Karel can sense its surroundings. One such <em>condition</em> is <code>k.frontIsClear()</code>,
      which is <code>true</code> when there's no wall directly ahead.</p>` },
      { md: `<h2>Walk until blocked</h2>
      <p>Read this as: "while the front is clear, move." Karel keeps stepping and re-checks before each
      step; the moment a wall is ahead, the loop stops. This works no matter how wide the world is.</p>` },
      { world: `Dimension: (7, 1)
Karel: (1, 1); east
BeeperBag: INFINITY`, code: function main(k) {
          while (k.frontIsClear()) {
            k.move();
          }
      } },
      { md: `<h2>Work along the way</h2>
      <p>Just like a for loop, a while loop can do several things each pass. Here Karel fills an entire
      row with beepers, however long the row happens to be, then drops one on the final square.</p>` },
      { world: `Dimension: (6, 1)
Karel: (1, 1); east
BeeperBag: INFINITY`, code: function main(k) {
          while (k.frontIsClear()) {
            k.putBeeper();
            k.move();
          }
          k.putBeeper();
      } },
      { md: `<h2>Reaching a corner</h2>
      <p>Combining while loops lets Karel navigate. Below, Karel walks east to the wall, turns to face
      north, then walks up to the far corner — without knowing the grid's size in advance.</p>` },
      { world: `Dimension: (5, 5)
Karel: (1, 1); east
BeeperBag: INFINITY`, code: function main(k) {
          while (k.frontIsClear()) {
            k.move();
          }
          k.turnLeft();
          while (k.frontIsClear()) {
            k.move();
          }
      } },
      { md: `<div class="callout warn"><strong>Watch out</strong>
      A while loop only stops when its condition becomes <code>false</code>. If the condition can never
      change, Karel loops forever. Always make sure something inside the loop moves you toward stopping.</div>` },
      { md: `<div class="callout tip"><strong>You learned</strong>
      A <code>while</code> loop repeats as long as a condition is <code>true</code>. Use it with sensing
      commands like <code>frontIsClear()</code> when you don't know the exact number of repetitions.</div>` },
    ];

    const esc = s => s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));

    function highlight(src) {
      return src.split(/(\/\/[^\n]*|`[^`]*`|"[^"]*"|'[^']*')/g).map((p, i) => {
        if (i % 2 === 1) return `<span class="${p.startsWith("//") ? "cm" : "st"}">${esc(p)}</span>`;
        let h = esc(p);
        h = h.replace(/\b(function|for|while|if|else|let|const|return|true|false|new)\b/g, '<span class="kw">$1</span>');
        h = h.replace(/\b(\d+)\b/g, '<span class="nm">$1</span>');
        return h;
      }).join("");
    }

    function dedent(s) {
      const lines = s.replace(/^\n+/, "").replace(/\s+$/, "").split("\n");
      const widths = lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length);
      const min = widths.length ? Math.min(...widths) : 0;
      return lines.map(l => l.slice(min)).join("\n");
    }

    function bodySource(fn) {
      const s = fn.toString();
      return dedent(s.slice(s.indexOf("{") + 1, s.lastIndexOf("}")));
    }

    let counter = 0;
    const nb = document.getElementById("notebook");

    function renderMd(cell) {
      const div = document.createElement("div");
      div.className = "md";
      div.innerHTML = cell.md;
      nb.appendChild(div);
    }

    async function renderCode(cell) {
      const n = ++counter;
      const wrap = document.createElement("div");
      wrap.className = "cell";
      wrap.innerHTML =
        `<div class="in"><div class="prompt">In [${n}]:</div>` +
        `<pre class="code"><code>${highlight(bodySource(cell.code))}</code></pre></div>` +
        `<div class="out"><div class="prompt out-prompt">Out[${n}]:</div>` +
        `<div class="render"><span class="status">Running…</span></div></div>`;
      nb.appendChild(wrap);
      const render = wrap.querySelector(".render");
      try {
        const img = await runKarel(cell.world, cell.code, cell.opts || { cellSize: 46, delay: 150 });
        render.replaceChildren(img);
        if (img.dataset.error) {
          const e = document.createElement("div");
          e.className = "err";
          e.textContent = "Karel stopped early: " + img.dataset.error;
          render.appendChild(e);
        }
      } catch (err) {
        render.innerHTML = `<div class="err">Error: ${esc(err.message)}</div>`;
      }
    }

    for (const cell of cells) {
      if (cell.md !== undefined) renderMd(cell);
      else await renderCode(cell);
    }
  </script>
</body>
