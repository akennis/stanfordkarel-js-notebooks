<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>k.facingEast() — Karel Reference</title>
  <link rel="stylesheet" href="lesson.css">
</head>
<body>
  <header class="course">
    <div class="crumb">Karel Reference · Condition</div>
    <h1><code>k.facingEast()</code></h1>
    <p class="lead">Ask whether Karel is currently facing east.</p>
  </header>

  <main id="notebook"></main>

  <script type="module">
    import { renderNotebook } from "./lesson.js";

    const cells = [
      { md: `<h2>What it does</h2>
      <p><code>k.facingEast()</code> returns <code>true</code> when Karel is pointing east and
      <code>false</code> otherwise. It only reports the direction; it never turns Karel. (East is
      "right" on the grid, toward higher avenue numbers.)</p>
      <p>Its opposite is <code>k.notFacingEast()</code> (<code>true</code> when Karel points any other
      way), which drives the "turn until facing east" idiom below.</p>
      <p><strong>See also:</strong> the sibling conditions
      <a href="./ref-facing-north.html"><code>facingNorth()</code></a>,
      <a href="./ref-facing-south.html"><code>facingSouth()</code></a>,
      <a href="./ref-facing-west.html"><code>facingWest()</code></a>.</p>` },

      { md: `<h2>Simple example</h2>
      <p>Karel starts facing east, so the <code>if</code> is true and it drops a beeper to confirm.</p>` },
      { world: `Dimension: (5, 5)
Karel: (1, 1); east
BeeperBag: INFINITY`, code: `function main(k) {
  if (k.facingEast()) {
    k.putBeeper();
  }
}` },
      { md: `<p>Karel is facing east, so a beeper lands on <code>(1, 1)</code>.</p>` },

      { md: `<h2>Complex example</h2>
      <p>Turn until Karel faces east, whatever its start. Keep turning left <em>while</em> it's not yet
      facing east. Here Karel begins facing south and needs a single left turn to reach east.</p>` },
      { world: `Dimension: (5, 5)
Karel: (1, 1); south`, code: `function main(k) {
  while (k.notFacingEast()) {
    k.turnLeft();
  }
}` },
      { md: `<p>South turned left is east, so the loop turns once and stops. The same loop would fix up any
      other starting direction too.</p>` },

      { md: `<h2>Challenges</h2>` },

      { world: `Dimension: (5, 5)
Karel: (1, 1); south`,
        prompt: `<strong>Face east.</strong> Karel starts facing south. Turn it so it faces east. (One
        left turn will do it.)`,
        check: ["direction"],
        solution: function main(k) {
          k.turnLeft();
        } },

      { world: `Dimension: (5, 5)
Karel: (1, 1); north`,
        prompt: `<strong>Face east from anywhere.</strong> Karel starts facing north here — but write code
        that ends facing east <strong>regardless</strong> of the starting direction, using a
        <code>while</code> loop with <code>notFacingEast()</code>.`,
        check: ["direction"],
        solution: function main(k) {
          while (k.notFacingEast()) {
            k.turnLeft();
          }
        } },

      { md: `<div class="callout tip"><strong>Summary</strong>
      <code>k.facingEast()</code> reports whether Karel points east; <code>notFacingEast()</code> is its
      opposite. Loop <code>while (k.notFacingEast()) k.turnLeft();</code> to face east from any start.</div>` },
    ];

    renderNotebook(cells, undefined, { isolate: true });
  </script>

  <script type="module" src="../site-nav.js"></script>
